[versions]
agp                  = "8.3.2"
kotlin               = "1.9.23"
coreKtx              = "1.13.1"
appcompat            = "1.7.0"
material             = "1.12.0"
constraintlayout     = "2.1.4"
recyclerview         = "1.3.2"
lifecycle            = "2.7.0"
activity             = "1.9.0"
fragment             = "1.7.0"
navigation           = "2.7.7"
room                 = "2.6.1"
datastore            = "1.1.1"
coroutines           = "1.8.0"
billing              = "6.2.1"
serialization        = "1.6.3"
junit                = "4.13.2"
mockk                = "1.13.10"
coroutinesTest       = "1.8.0"
androidxJunit        = "1.1.5"
espresso             = "3.5.1"

[libraries]
# UI
material                     = { group = "com.google.android.material",   name = "material",                   version.ref = "material" }
constraintlayout             = { group = "androidx.constraintlayout",      name = "constraintlayout",           version.ref = "constraintlayout" }
recyclerview                 = { group = "androidx.recyclerview",          name = "recyclerview",               version.ref = "recyclerview" }

# Architecture
lifecycle-viewmodel          = { group = "androidx.lifecycle",             name = "lifecycle-viewmodel-ktx",    version.ref = "lifecycle" }
lifecycle-runtime            = { group = "androidx.lifecycle",             name = "lifecycle-runtime-ktx",      version.ref = "lifecycle" }
activity-ktx                 = { group = "androidx.activity",              name = "activity-ktx",               version.ref = "activity" }
fragment-ktx                 = { group = "androidx.fragment",              name = "fragment-ktx",               version.ref = "fragment" }
navigation-fragment          = { group = "androidx.navigation",            name = "navigation-fragment-ktx",    version.ref = "navigation" }
navigation-ui                = { group = "androidx.navigation",            name = "navigation-ui-ktx",          version.ref = "navigation" }

# Data
datastore-preferences        = { group = "androidx.datastore",             name = "datastore-preferences",      version.ref = "datastore" }
room-runtime                 = { group = "androidx.room",                  name = "room-runtime",               version.ref = "room" }
room-ktx                     = { group = "androidx.room",                  name = "room-ktx",                   version.ref = "room" }
room-compiler                = { group = "androidx.room",                  name = "room-compiler",              version.ref = "room" }

# Kotlin
coroutines-android           = { group = "org.jetbrains.kotlinx",          name = "kotlinx-coroutines-android", version.ref = "coroutines" }
serialization-json           = { group = "org.jetbrains.kotlinx",          name = "kotlinx-serialization-json", version.ref = "serialization" }

# Billing
billing-ktx                  = { group = "com.android.billingclient",      name = "billing-ktx",                version.ref = "billing" }

# Testing
junit                        = { group = "junit",                          name = "junit",                      version.ref = "junit" }
mockk                        = { group = "io.mockk",                       name = "mockk",                      version.ref = "mockk" }
coroutines-test              = { group = "org.jetbrains.kotlinx",          name = "kotlinx-coroutines-test",    version.ref = "coroutinesTest" }
androidx-junit               = { group = "androidx.test.ext",              name = "junit",                      version.ref = "androidxJunit" }
espresso-core                = { group = "androidx.test.espresso",         name = "espresso-core",              version.ref = "espresso" }
room-testing                 = { group = "androidx.room",                  name = "room-testing",               version.ref = "room" }

[plugins]
android-application          = { id = "com.android.application",                    version.ref = "agp" }
kotlin-android               = { id = "org.jetbrains.kotlin.android",               version.ref = "kotlin" }
kotlin-kapt                  = { id = "org.jetbrains.kotlin.kapt",                  version.ref = "kotlin" }
kotlin-serialization         = { id = "org.jetbrains.kotlin.plugin.serialization",  version.ref = "kotlin" }
