[versions]
agp                  = "9.2.1"
kotlin               = "2.3.21"
ksp                  = "2.3.7"
coreKtx              = "1.13.1"
appcompat            = "1.7.0"
material             = "1.13.0"
constraintlayout     = "2.2.1"
recyclerview         = "1.4.0"
lifecycle            = "2.10.0"
activity             = "1.13.0"
fragment             = "1.8.9"
navigation           = "2.9.8"
room                 = "2.8.4"
datastore            = "1.2.1"
coroutines           = "1.10.2"
billing              = "8.3.0"
serialization        = "1.11.0"
playServicesLocation = "21.3.0"
workManager          = "2.11.2"
viewpager2           = "1.1.0"
junit                = "4.13.2"
mockk                = "1.14.9"
coroutinesTest       = "1.10.2"
androidxJunit        = "1.3.0"
espresso             = "3.7.0"
testCore             = "1.6.1"

[libraries]
# UI
core-ktx                     = { group = "androidx.core",                    name = "core-ktx",                   version.ref = "coreKtx" }
appcompat                    = { group = "androidx.appcompat",                name = "appcompat",                  version.ref = "appcompat" }
material                     = { group = "com.google.android.material",       name = "material",                   version.ref = "material" }
constraintlayout             = { group = "androidx.constraintlayout",         name = "constraintlayout",           version.ref = "constraintlayout" }
recyclerview                 = { group = "androidx.recyclerview",             name = "recyclerview",               version.ref = "recyclerview" }
viewpager2                   = { group = "androidx.viewpager2",              name = "viewpager2",                 version.ref = "viewpager2" }

# Architecture
lifecycle-viewmodel          = { group = "androidx.lifecycle",                name = "lifecycle-viewmodel-ktx",    version.ref = "lifecycle" }
lifecycle-runtime            = { group = "androidx.lifecycle",                name = "lifecycle-runtime-ktx",      version.ref = "lifecycle" }
activity-ktx                 = { group = "androidx.activity",                 name = "activity-ktx",               version.ref = "activity" }
fragment-ktx                 = { group = "androidx.fragment",                 name = "fragment-ktx",               version.ref = "fragment" }
navigation-fragment          = { group = "androidx.navigation",               name = "navigation-fragment-ktx",    version.ref = "navigation" }
navigation-ui                = { group = "androidx.navigation",               name = "navigation-ui-ktx",          version.ref = "navigation" }

# Data
datastore-preferences        = { group = "androidx.datastore",                name = "datastore-preferences",      version.ref = "datastore" }
room-runtime                 = { group = "androidx.room",                     name = "room-runtime",               version.ref = "room" }
room-ktx                     = { group = "androidx.room",                     name = "room-ktx",                   version.ref = "room" }
room-compiler                = { group = "androidx.room",                     name = "room-compiler",              version.ref = "room" }

# Kotlin
coroutines-android           = { group = "org.jetbrains.kotlinx",             name = "kotlinx-coroutines-android", version.ref = "coroutines" }
serialization-json           = { group = "org.jetbrains.kotlinx",             name = "kotlinx-serialization-json", version.ref = "serialization" }

# Platform
play-services-location       = { group = "com.google.android.gms",           name = "play-services-location",     version.ref = "playServicesLocation" }
work-runtime-ktx             = { group = "androidx.work",                     name = "work-runtime-ktx",           version.ref = "workManager" }

# Billing
billing-ktx                  = { group = "com.android.billingclient",         name = "billing-ktx",                version.ref = "billing" }

# Testing
junit                        = { group = "junit",                             name = "junit",                      version.ref = "junit" }
mockk                        = { group = "io.mockk",                          name = "mockk",                      version.ref = "mockk" }
coroutines-test              = { group = "org.jetbrains.kotlinx",             name = "kotlinx-coroutines-test",    version.ref = "coroutinesTest" }
androidx-junit               = { group = "androidx.test.ext",                 name = "junit",                      version.ref = "androidxJunit" }
espresso-core                = { group = "androidx.test.espresso",            name = "espresso-core",              version.ref = "espresso" }
test-core-ktx                = { group = "androidx.test",                     name = "core-ktx",                   version.ref = "testCore" }
room-testing                 = { group = "androidx.room",                     name = "room-testing",               version.ref = "room" }

[plugins]
android-application          = { id = "com.android.application",                          version.ref = "agp" }
kotlin-android               = { id = "org.jetbrains.kotlin.android",                     version.ref = "kotlin" }
kotlin-kapt                  = { id = "org.jetbrains.kotlin.kapt",                        version.ref = "kotlin" }
kotlin-serialization         = { id = "org.jetbrains.kotlin.plugin.serialization",        version.ref = "kotlin" }
ksp                          = { id = "com.google.devtools.ksp",                          version.ref = "ksp" }
